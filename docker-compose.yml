services:
  # 1. FastAPI Conversion Engine (Self-contained with LibreOffice headless)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convertly-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - TEMP_STORAGE_DIR=/tmp/convertly_storage
      - MAX_FILE_SIZE_BYTES=52428800
      - FILE_RETENTION_SECONDS=3600
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=convertly_production
      - MONGODB_COLLECTION=conversion_jobs
      - ALLOW_IN_MEMORY_FALLBACK=false
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,https://convertly.vercel.app
    depends_on:
      - mongo
    restart: unless-stopped

  # 2. Local MongoDB Container
  mongo:
    image: mongo:7.0
    container_name: convertly-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # 3. Optional Gotenberg Service (alternative microservice for Office conversions)
  # gotenberg:
  #   image: gotenberg/gotenberg:8
  #   container_name: convertly-gotenberg
  #   ports:
  #     - "3001:3000"
  #   restart: unless-stopped

volumes:
  mongo_data:
